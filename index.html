<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças — Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-header">
      <div class="logo" aria-hidden="true">₢</div>
      <h1>Finanças</h1>
      <p>Controle sua renda e alocação mensal</p>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="login" role="tab" aria-selected="true">Entrar</button>
      <button type="button" class="tab" data-tab="register" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <form id="login-form" class="form-panel active" novalidate>
      <label for="login-name">Nome</label>
      <input type="text" id="login-name" name="name" autocomplete="username" required>

      <label for="login-password">Senha</label>
      <div class="password-field">
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" data-target="login-password" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
          <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="remember" checked>
        <span>Manter conectado neste computador</span>
      </label>

      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <form id="register-form" class="form-panel" novalidate hidden>
      <label for="register-name">Nome</label>
      <input type="text" id="register-name" name="name" autocomplete="username" required>

      <label for="register-email">E-mail</label>
      <input type="email" id="register-email" name="email" autocomplete="email" placeholder="seu@email.com" required>

      <label for="register-phone">Telefone</label>
      <input type="tel" id="register-phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required>

      <label for="register-password">Senha</label>
      <div class="password-field">
        <input type="password" id="register-password" name="password" autocomplete="new-password" minlength="4" required>
        <button type="button" class="password-toggle" data-target="register-password" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
          <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <label for="register-password-confirm">Confirmar senha</label>
      <div class="password-field">
        <input type="password" id="register-password-confirm" name="passwordConfirm" autocomplete="new-password" required>
        <button type="button" class="password-toggle" data-target="register-password-confirm" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
          <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <p id="register-error" class="error" hidden></p>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/crypto-auth.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
